# Sortie integration-test Dovecot. Plain IMAP only; never expose publicly.
protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout
auth_verbose = yes
mail_debug = no

ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

# Single virtual user namespace, all mail owned by one system uid.
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000
mail_home = /srv/mail/%u
mail_location = maildir:~/Maildir

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/passwd
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%u
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

# Keep IDLE cheap and connection limits generous for the two-connection sync
# engine plus the coordinator's third session.
mail_max_userip_connections = 50
imap_idle_notify_interval = 2 mins
imap_capability = +SPECIAL-USE

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
