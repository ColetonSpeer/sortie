name: Release iOS
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Signed build needs these repository secrets (from ~/sortie-keys):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (base64 of AuthKey_<id>.p8), APPLE_TEAM_ID,
#   APPLE_DEV_CERT_P12_BASE64 + APPLE_DEV_CERT_PASSWORD (one reusable Apple Development cert)
# Without them the job still produces an unsigned .ipa for manual sideloading.
jobs:
  ios:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEV_CERT_P12_BASE64: ${{ secrets.APPLE_DEV_CERT_P12_BASE64 }}
      APPLE_DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Version
        id: v
        run: |
          VERSION=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || VERSION=0.0.0
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build unsigned .ipa
        run: |
          flutter build ios --release --no-codesign --build-name=${{ steps.v.outputs.version }} --build-number=$GITHUB_RUN_NUMBER --dart-define=SORTIE_VERSION=${{ steps.v.outputs.version }}+$GITHUB_RUN_NUMBER
          mkdir -p Payload && cp -r build/ios/iphoneos/Runner.app Payload/ && zip -qr sortie-unsigned.ipa Payload

      - name: Signed archive (development, automatic signing via ASC API key)
        if: ${{ env.ASC_KEY_ID != '' }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 -d > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          # Temporary keychain holding ONE reusable development certificate
          # (secret APPLE_DEV_CERT_P12_BASE64). Minting a certificate per run
          # exhausts Apple's certificate limit within a few weeks.
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          if [ -n "$APPLE_DEV_CERT_P12_BASE64" ]; then
            echo "$APPLE_DEV_CERT_P12_BASE64" | base64 -d > dev-cert.p12
            security import dev-cert.p12 -k build.keychain -P "$APPLE_DEV_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain > /dev/null
            security find-identity -v -p codesigning build.keychain
            rm -f dev-cert.p12
          fi
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Runner.xcarchive archive \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            FLUTTER_BUILD_NAME=${{ steps.v.outputs.version }} FLUTTER_BUILD_NUMBER=$GITHUB_RUN_NUMBER
          cat > ExportOptions.plist <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          EOT
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          cp build/ipa/*.ipa sortie-signed.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: sortie-ios
          path: sortie-*.ipa
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sortie-*.ipa
