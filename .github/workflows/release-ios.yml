name: Release iOS (unsigned)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build unsigned .ipa
        run: |
          VERSION=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || VERSION=0.0.0
          flutter build ios --release --no-codesign --build-name=$VERSION --build-number=$GITHUB_RUN_NUMBER
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr sortie-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: sortie-ios-unsigned
          path: sortie-unsigned.ipa
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sortie-unsigned.ipa
