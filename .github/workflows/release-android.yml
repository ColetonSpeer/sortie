name: Release Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOT
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOT
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build
        run: |
          VERSION=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || VERSION=0.0.0
          flutter build apk --release --build-name=$VERSION --build-number=$GITHUB_RUN_NUMBER
          flutter build apk --release --split-per-abi --build-name=$VERSION --build-number=$GITHUB_RUN_NUMBER
          cp build/app/outputs/flutter-apk/app-release.apk sortie.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk sortie-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sortie-android
          path: sortie*.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sortie*.apk
