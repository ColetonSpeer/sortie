name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || VERSION=0.0.0
          flutter build windows --release --build-name=$VERSION --build-number=$GITHUB_RUN_NUMBER
          7z a sortie-windows-x64.zip ./build/windows/x64/runner/Release/*
      - uses: actions/upload-artifact@v4
        with:
          name: sortie-windows-x64
          path: sortie-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sortie-windows-x64.zip
