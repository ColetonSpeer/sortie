name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded

  imap-integration:
    runs-on: ubuntu-24.04
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: docker compose -f tool/docker-compose.dovecot.yml up -d
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Wait for Dovecot
        run: for i in $(seq 1 30); do nc -z localhost 3143 && break; sleep 1; done
      - run: flutter test test/data/integration --dart-define=IMAP_TEST_HOST=localhost --dart-define=IMAP_TEST_PORT=3143
      - if: always()
        run: docker compose -f tool/docker-compose.dovecot.yml down
