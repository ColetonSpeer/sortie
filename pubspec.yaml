name: sortie
description: Sortie - an email client that sorts itself.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  dio: ^5.11.1
  drift: ^2.35.0
